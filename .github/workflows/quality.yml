name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:engineering-debt
      - run: node scripts/verify-framework-runner.mjs core hardening contracts node python backend cloud swiftpm helmfile deno cocoapods ansible terraform ai i18n
      - if: runner.os == 'Windows'
        run: npm run verify:ipc
      - name: Configure Electron sandbox on Linux
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run verify:ipc
