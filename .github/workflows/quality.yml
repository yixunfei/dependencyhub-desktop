name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:core
      - run: npm run verify:manager-contracts
      - run: npm run verify:framework -- --group core --group contracts --group node --group python --group backend --group cloud --group swiftpm --group helmfile
