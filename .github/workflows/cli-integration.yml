name: real-cli

on:
  workflow_dispatch:
  pull_request:

jobs:
  npm-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report CLI environment
        run: node --version && npm --version && npm config get registry
      - name: Run real npm fixture gate
        run: npm run verify:core
