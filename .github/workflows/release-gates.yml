name: release-gates

on:
  workflow_dispatch:

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Evidence bundles are exported by the app into a gitignored directory,
      # so a fresh checkout normally has none. When evidence IS present the
      # verifiers run in strict mode; when absent they run with --optional,
      # which is a trivial pass — the job emits a warning so the gate is never
      # silently green while actually guaranteeing nothing.
      - name: Verify release evidence
        run: |
          if [ -d .npmDesktopManager ] && [ -n "$(ls -A .npmDesktopManager 2>/dev/null)" ]; then
            echo "Evidence bundle present; running strict verification"
            npm run verify:release-integrity -- --no-write
            npm run verify:release-signature
            npm run verify:release-trust
          else
            echo "::warning::No release evidence bundle is present in this checkout; the evidence verifiers trivially pass and guarantee nothing about release integrity. Upload the .npmDesktopManager bundle from a release build to make this gate meaningful."
            npm run verify:release-integrity -- --no-write --optional
            npm run verify:release-signature -- --optional
            npm run verify:release-trust -- --optional
          fi
        env:
          NPM_MANAGER_RELEASE_SIGNING_KEY: ${{ secrets.NPM_MANAGER_RELEASE_SIGNING_KEY }}
          NPM_MANAGER_RELEASE_SIGNER: ${{ vars.NPM_MANAGER_RELEASE_SIGNER }}
